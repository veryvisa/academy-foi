<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">开车去美国或外省旅行，BC 基本险里的第三方责任够不够？</title>
<desc id="d">基本险含 $200,000 第三方责任。在 BC 省内多数事故用不上它，但在外省或美国，当地法律可能允许对方起诉你，赔偿可能远超这个额度；可选的扩展第三方责任最高可加到 $500 万。</desc>
<rect width="900" height="1440" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">第三方责任出省 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">开车去美国或外省旅行，BC 基本险里的第三方责任够不够？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">基本险含 $200,000 第三方责任。在 BC 省内多数事故用不上它，但在外省或美</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">国，当地法律可能允许对方起诉你，赔偿可能远超这个额度；可选的扩展第三方责</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">任最高可加到 $500 万。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">第三方责任什么时候出场</text>
<rect x="40.0" y="375" width="403.0" height="229" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">BC 省内</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">撞伤人</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">走 Enhanced Care，多数情况不能就人伤起诉</text>
<text x="54.0" y="491" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">撞坏别人的车</text>
<text x="54.0" y="513" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">对方的车由对方的保险修</text>
<text x="54.0" y="547" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">撞坏非车辆财产</text>
<text x="54.0" y="569" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">围栏、电线杆、店面：第三方责任出场</text>
<rect x="457.0" y="375" width="403.0" height="229" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="471.0" y="407" font-size="19" fill="#B45309" font-weight="700" text-anchor="start">外省与美国</text>
<text x="471.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">人伤与财产</text>
<text x="471.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">当地法律允许起诉时，第三方责任替你应诉和赔偿</text>
<text x="471.0" y="491" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">额度</text>
<text x="471.0" y="513" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">超出保单额度的部分要自己承担</text>
<text x="471.0" y="547" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">墨西哥及其他国家</text>
<text x="471.0" y="569" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">基本险只在加拿大和美国有效</text>
<text x="40" y="648" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">出发前核对三件事</text>
<rect x="40" y="666" width="820" height="98" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="700" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">第一件：保单上的第三方责任额度</text>
<circle cx="64" cy="729" r="3.2" fill="#5B6B7F"/>
<text x="76" y="734" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">基本险自带 $200,000</text>
<line x1="450" y1="765" x2="450" y2="792" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,789 L458,789 L450,801 Z" fill="#5B6B7F"/>
<text x="466" y="784" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">要去外省或美国</text>
<rect x="40" y="803" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="837" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第二件：要不要扩展</text>
<circle cx="64" cy="866" r="3.2" fill="#2F5D8A"/>
<text x="76" y="871" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">扩展第三方责任是 Autoplan 可选险，最高 $500 万</text>
<circle cx="64" cy="898" r="3.2" fill="#2F5D8A"/>
<text x="76" y="903" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">加多少找 Autoplan 经纪，按出行地与自己的资产定</text>
<line x1="450" y1="934" x2="450" y2="961" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,958 L458,958 L450,970 Z" fill="#5B6B7F"/>
<text x="466" y="953" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">要出加美</text>
<rect x="40" y="972" width="820" height="98" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="1006" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">第三件：目的地在不在承保范围</text>
<circle cx="64" cy="1035" r="3.2" fill="#B42318"/>
<text x="76" y="1040" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">基本险只在加拿大和美国有效</text>
<rect x="40" y="1092" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1126" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1155" r="3.2" fill="#B45309"/>
<text x="76" y="1160" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「Enhanced Care 之后责任险没用了」：非车辆财产与出省仍要靠它。</text>
<circle cx="64" cy="1186" r="3.2" fill="#B45309"/>
<text x="76" y="1191" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「$200,000 到哪都够」：外省与美国允许起诉，费用可能高得多。</text>
<circle cx="64" cy="1218" r="3.2" fill="#B45309"/>
<text x="76" y="1223" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「去墨西哥也照保」：基本险只保加拿大和美国。</text>
<line x1="40" y1="1278" x2="860" y2="1278" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1303" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1325" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Basic insurance and Enhanced Care（2026-11-03 回读）</text>
<text x="40" y="1347" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ICBC · Extended Third Party Liability（2026-11-03 回读）</text>
<text x="40" y="1376" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本图只讲第三方责任；自己受伤的给付与旅行医疗险另看。在 BC 省内被判定构成规定刑事罪名的驾驶者仍可被起诉（Insurance </text>
<text x="40" y="1396" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">(Vehicle) Act s.116(2)(f)）。</text>
</svg>
