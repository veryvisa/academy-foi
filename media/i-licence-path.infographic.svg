<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1574" width="900" height="1574" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">考完试就能在 BC 做一般保险销售吗？要走哪几步？</title>
<desc id="d">不能。Level 1 是两段式：先满足教育资格，再修完 Council Rules Course，并由持牌代理机构担保，才能向 Insurance Council 申请牌照。</desc>
<rect width="900" height="1574" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">考 Level 1 牌照要走哪几步 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">考完试就能在 BC 做一般保险销售吗？要走哪几步？</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不能。Level 1 是两段式：先满足教育资格，再修完 Council Rules Cours</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">e，并由持牌代理机构担保，才能向 Insurance Council 申请牌照。</text>
<rect x="40" y="304" width="820" height="160" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="338" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第一步：教育资格</text>
<circle cx="64" cy="367" r="3.2" fill="#2F5D8A"/>
<text x="76" y="372" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">几条认可路径任选其一，通过其中任一即满足</text>
<circle cx="64" cy="398" r="3.2" fill="#2F5D8A"/>
<text x="76" y="404" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">路径含 FOI、CAIB 1、CIP C11+C130、GIE C81+C82</text>
<circle cx="64" cy="430" r="3.2" fill="#2F5D8A"/>
<text x="76" y="435" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">另认可 ILScorp L1 等效</text>
<line x1="450" y1="466" x2="450" y2="494" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,490 L458,490 L450,502 Z" fill="#5B6B7F"/>
<text x="466" y="486" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再修课程</text>
<rect x="40" y="504" width="820" height="129" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="538" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">第二步：修完规则课程</text>
<circle cx="64" cy="568" r="3.2" fill="#0E7C7B"/>
<text x="76" y="572" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">修完 Council Rules Course，所有申请人必修</text>
<circle cx="64" cy="599" r="3.2" fill="#0E7C7B"/>
<text x="76" y="604" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">拿牌必修，可提前做</text>
<line x1="450" y1="636" x2="450" y2="662" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,660 L458,660 L450,672 Z" fill="#5B6B7F"/>
<text x="466" y="654" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再找担保</text>
<rect x="40" y="674" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="708" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第三步：持牌代理机构担保</text>
<circle cx="64" cy="736" r="3.2" fill="#2F5D8A"/>
<text x="76" y="742" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">须由持牌代理机构担保</text>
<circle cx="64" cy="768" r="3.2" fill="#2F5D8A"/>
<text x="76" y="773" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有担保，考完也拿不到牌</text>
<line x1="450" y1="804" x2="450" y2="832" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,828 L458,828 L450,840 Z" fill="#5B6B7F"/>
<text x="466" y="824" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">再递申请</text>
<rect x="40" y="842" width="820" height="129" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="876" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">第四步：向 Council 申请</text>
<circle cx="64" cy="906" r="3.2" fill="#0E7C7B"/>
<text x="76" y="910" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">向 Insurance Council 递交 Level 1 牌照申请</text>
<circle cx="64" cy="937" r="3.2" fill="#0E7C7B"/>
<text x="76" y="942" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">拿牌后须在持牌 agent 监督下工作</text>
<rect x="40" y="994" width="820" height="192" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1028" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">时限与换版，按递件当日核</text>
<circle cx="64" cy="1056" r="3.2" fill="#B45309"/>
<text x="76" y="1062" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Council 牌照页现写：先修课程或考试成绩有效 24 个月</text>
<circle cx="64" cy="1088" r="3.2" fill="#B45309"/>
<text x="76" y="1093" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">牌照申请要在通过考试后 24 个月内送达 Council</text>
<circle cx="64" cy="1120" r="3.2" fill="#B45309"/>
<text x="76" y="1124" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">已读 CAIB 旧版的，要在 2026-12-31 前完成并通过考试</text>
<circle cx="64" cy="1151" r="3.2" fill="#B45309"/>
<text x="76" y="1156" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">2027-01-01 起只认新版；递件前以当日页面为准</text>
<rect x="40" y="1208" width="820" height="154" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1242" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1270" r="3.2" fill="#B45309"/>
<text x="76" y="1276" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「考试通过就能拿牌执业。」：考试只是教育资格那一步，还要修课程、有担保，再向 Council 申</text>
<text x="76" y="1301" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">请</text>
<circle cx="64" cy="1328" r="3.2" fill="#B45309"/>
<text x="76" y="1332" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「考试成绩与申请期限一直沿用现行规则。」：规则会变，要按递件当日核</text>
<line x1="40" y1="1388" x2="860" y2="1388" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1413" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1435" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Individual General Insurance Licence — Level 1 Salesperson 的条件与限制</text>
<text x="40" y="1457" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">General Insurance Competency Framework — Level 1</text>
<text x="40" y="1480" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Individual General Insurance Licence</text>
<text x="40" y="1502" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Council Rules and Code of Conduct</text>
<text x="40" y="1530" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-11-09 依据讲解页与已核规则摘要制作；个案以官方原文与主管机构答复为准。</text>
</svg>
